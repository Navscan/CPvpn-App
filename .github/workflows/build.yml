name: Build Release APK & Publish

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Prepare APK for Release
      run: |
        mkdir -p release
        # Find the generated release APK and rename it exactly to CPvpn.apk
        find app/build/outputs/apk/release -name "*.apk" -exec cp {} release/CPvpn.apk \;

    - name: Create GitHub Release & Upload Asset
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: CPvpn Release v1.0.${{ github.run_number }}
        body: |
          Automated release for commit ${{ github.sha }}
          * Build #${{ github.run_number }}
        draft: false
        prerelease: false
        files: release/CPvpn.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
