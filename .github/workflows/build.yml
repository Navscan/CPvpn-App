name: Build Debug APK & Publish

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # CHANGED: Building Debug to bypass keystore requirement for UI testing
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Prepare APK for Release
      run: |
        mkdir -p release
        # Find the generated debug APK and rename it to CPvpn.apk
        find app/build/outputs/apk/debug -name "*.apk" -exec cp {} release/CPvpn.apk \;

    - name: Create GitHub Release & Upload Asset
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.${{ github.run_number }}-debug
        name: CPvpn Debug v1.0.${{ github.run_number }}
        body: |
          Debug build for UI testing (Voucher Modal).
        draft: false
        prerelease: true
        files: release/CPvpn.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
